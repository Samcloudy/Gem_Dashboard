<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeM Label Seller — Command Centre</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#18222f;--mu:#667386;--bd:#e3e8ef;--pr:#1a4d8f;--ac:#eaf2fb;--g:#2e7d32;--r:#b3261e;--a:#c47f00}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202b;--tx:#e6ebf2;--mu:#93a0b2;--bd:#2a3442;--pr:#6aa8f0;--ac:#1e2c3f;--g:#6fcf76;--r:#ff8a80;--a:#ffc107}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,sans-serif}
h1{margin:0 0 4px;font-size:21px;color:var(--pr)}
h2{margin:22px 0 10px;font-size:17px;color:var(--pr)}
h3{margin:0 0 10px;font-size:15px}
.mu{color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
#drop{border:2px dashed var(--pr);border-radius:10px;padding:22px;text-align:center;cursor:pointer;background:var(--card);margin:10px 0;display:block;position:relative}
#drop:hover,#drop.over{background:var(--ac)}
#drop input[type=file]{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
select,input,button{font:inherit;padding:7px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
button{cursor:pointer;background:var(--pr);color:#fff;border:0}
button.s{background:var(--ac);color:var(--pr)}
button.d{background:var(--r)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}
.tab{background:var(--ac);color:var(--pr);font-size:13px;padding:9px 16px}
.tab.on{background:var(--pr);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--ac);border-radius:8px;padding:12px}
.kpi b{display:block;font-size:20px;color:var(--pr);line-height:1.2}
.kpi span{font-size:11px;color:var(--mu)}
.kpi small{font-size:10px;color:var(--mu);display:block;margin-top:4px;font-style:italic}
.sc{overflow:auto;max-height:600px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--ac);z-index:1;white-space:nowrap;font-weight:600}
.p{display:inline-block;padding:2px 8px;margin:1px;border-radius:9px;font-size:11px;font-weight:600;background:var(--ac);color:var(--pr)}
.p.r{background:#fdecea;color:#b3261e}.p.a{background:#fff4e5;color:#a06000}.p.g{background:#e8f5e9;color:#2e7d32}.p.b{background:#e3f2fd;color:#1565c0}
.ch{position:relative;height:280px}
.pos{color:var(--g)}.neg{color:var(--r)}
.hero{background:linear-gradient(135deg,#1a4d8f 0%,#2e7d32 100%);color:#fff;border-radius:12px;padding:20px;margin-bottom:14px}
.hero h2{color:#fff;margin:0 0 10px}
.hero .kpi{background:rgba(255,255,255,.15)}
.hero .kpi b{color:#fff}.hero .kpi span,.hero .kpi small{color:rgba(255,255,255,.85)}
.clickable{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;position:relative}
.clickable:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,77,143,.15);border-color:var(--pr)}
.rank{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--pr);color:#fff;font-weight:700;font-size:11px;margin-right:6px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;font-size:12px}
.crumb{background:var(--pr);color:#fff;padding:4px 10px;border-radius:14px;cursor:pointer;font-size:12px}
.crumb:hover{background:#0f3a6d}
.crumb .x{margin-left:6px;opacity:.7}
.empty{color:var(--mu);font-style:italic;padding:14px 0}
.warn{background:#fff4e5;border-left:4px solid var(--a);padding:10px 14px;border-radius:6px;margin:8px 0;font-size:12.5px}
.info{background:var(--ac);border-left:4px solid var(--pr);padding:10px 14px;border-radius:6px;margin:8px 0;font-size:12.5px}
.slider{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.slider input[type=range]{flex:1;max-width:180px}
.slider .val{color:var(--pr);font-weight:600;min-width:30px;text-align:right}
.chip{display:inline-block;padding:4px 10px;margin:3px;border-radius:12px;font-size:11.5px;font-weight:500;background:var(--ac);color:var(--pr);cursor:pointer;transition:background .1s}
.chip:hover{background:var(--pr);color:#fff}
.chip.on{background:var(--pr);color:#fff}
details.spec{margin:8px 0}
details.spec summary{cursor:pointer;font-weight:600;color:var(--pr);padding:8px 0;font-size:13.5px}
details.spec[open] summary{margin-bottom:8px}
@media print{#drop,.bar,.tabs,.crumb{display:none}.card{box-shadow:none}}
</style>
</head>
<body>

<h1>🏷️ GeM Label Seller — Command Centre</h1>
<div class="mu">Every row is a <b>recorded purchase</b>. Prices shown are what buyers actually paid. Recommendations are analytical estimates, not guaranteed wins.</div>

<label id="drop" for="file">
  📂 <b>Drop GeM Excel here</b> or click to select
  <input type="file" id="file" accept=".xlsx,.xls">
  <div class="mu">Uploads merge into a de-duplicated master kept in this browser</div>
</label>

<div id="st" class="mu"></div>

<div id="app" hidden>
  <div class="card bar">
    <label>From <input type="date" id="from"></label>
    <label>To <input type="date" id="to"></label>
    <label>Mode <select id="mode">
      <option value="">All modes</option>
      <option value="Direct">📦 Direct (GEMC)</option>
      <option value="Bid">🔨 Bid</option>
      <option value="RA">🔄 Reverse Auction</option>
      <option value="Bid/RA">🔨🔄 Bid / RA</option>
      <option value="Unknown">❓ Unknown</option>
    </select></label>
    <label>Seller <select id="me"></select></label>
    <button class="s" id="xls">⬇ Excel</button>
    <button class="s" id="jsn">⬇ Backup JSON</button>
    <button class="s" id="prt">🖨</button>
    <button class="d" id="rst">Reset</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<script>
/* =========================================================
   STATE
   ========================================================= */
var KEY='gem_master_v11';
var ALL=[],F=[],ME='',MODE='',TAB='cmd',CH={},MX={};
var W={rec:20,freq:20,val:25,fit:15,comp:10,conf:10};
var $=function(id){return document.getElementById(id)};
var ls={g:function(k){try{return localStorage.getItem(k)}catch(e){return null}},s:function(k,v){try{localStorage.setItem(k,v);return 1}catch(e){return 0}},d:function(k){try{localStorage.removeItem(k)}catch(e){}}};
try{ALL=JSON.parse(ls.g(KEY)||'[]')}catch(e){ALL=[]}

var EXP=['Generated Date','Buyer Designation','Buyer Contact No','Buyer GSTIN','Buyer Address','Seller Company Name','Seller Contact No','Seller GSTIN','Seller Address','Product Name','Ordered Quantity','Unit Price','Price (Inclusive of All Duties & Taxes) - INR'];

/* NEW: Specification columns — auto-detected by fuzzy name match */
var SPEC_MAP={
  mode:    ['procurement mode','purchase mode','mode of procurement'],
  ptype:   ['product type','label type'],
  material:['material type','material'],
  printing:['printing compatibility','print type','printer'],
  adhesive:['adhesive type','adhesive'],
  finish:  ['surface finish','finish'],
  format:  ['label format','form factor','format'],
  die:     ['die-cut type','die cut','dicut'],
  gsm:     ['gsm','grammage','gsm of the label sticker'],
  size:    ['size of a single label sticker','label size','size'],
  pack:    ['number of label stickers in a packet','pack quantity','pack size','qty per packet']
};

var CATS=[
  ['Thermal / Barcode rolls',/thermal|barcode|direct|ttr|ribbon|transfer/i],
  ['Security / Tamper',/secur|tamper|hologram|void|seal|warranty/i],
  ['A4 / Sheet labels',/\ba[34]\b|sheet|laser|inkjet/i],
  ['Address / Shipping',/address|ship|courier|dispatch|postal|awb/i],
  ['Asset / QR tags',/asset|inventory|qr|rfid|tag|serial/i],
  ['Printed / Custom',/print|custom|logo|brand|personali/i],
  ['Plain / Adhesive',/blank|plain|adhesive|self|paper|sticker|label/i]
];

var SEGMENTS=[
  ['📮 Post Offices / Postal',/post ?office|supdt|spos|postmaster|postal|\brms\b|speed post|mail|sorting|head post|dak/i],
  ['🏥 Hospitals / Health',/hospital|medical|health|aiims|doctor|nurse|phc|chc|\btb\b|nursing|clinic|ayurved|veterinary|dispensary|maternity/i],
  ['🎓 Education / Colleges',/college|university|school|principal|professor|institute|\bkv\b|kendriya vidyalaya|polytechnic|\biit\b|\bnit\b|\biim\b|iiser/i],
  ['✈️ Airports / Ports',/airport|port|air india|\baai\b|customs|cargo|terminal|immigration|export inspection|marine|shipping/i],
  ['🚂 Railways',/railway|\bdrb\b|\bdrm\b|station master|coach|divisional/i],
  ['🏛️ Govt Departments / PSU',/secretariat|collector|commissioner|director|department|ministry|nagar palika|municipal|\bpsu\b|corporation|authority|\blic\b|sbi|bank/i],
  ['💼 Police / Defence',/police|defence|army|navy|air force|crpf|cisf|itbp|bsf|cbi|traffic|court|judicial|legal|magistrate/i],
  ['⚡ Power / Utilities',/electricity|power|discom|energy|bsnl|bharat sanchar|utility|water works|jal board/i],
  ['🔬 Research / Labs',/research|icar|csir|icmr|drdo|isro|cftri|niist/i],
  ['🌾 Agriculture',/agriculture|krishi|farm|mandi|seed|horticulture|animal husbandry/i],
  ['🎯 Other Govt',/.*/]
];

var BRANDS=['AKHIL','CORAL','NOVAJET','DESMAT','BRADY','CHECKO','GOLDCOLT','ODDY','RAJSON','TARSONS','RAINBOW','VLLPL','LABELKART','SAIRAKESH','DOOKS','SKMPPL','AADO','ROLLY','TG TECHNO GRAPHICS','M S PAPER ROLL','HAUSER','3M','AVERY BRAND','AVERY','Texlabels','JIRAWALA PAPERS','PCAKG','swastic','SPECIALITY LABELS','Stickmore','Kores','super max'];

var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var BANDS=[[1,50],[51,200],[201,1000],[1001,5000],[5001,1e12]];

/* =========================================================
   HELPERS
   ========================================================= */
function cat(p){for(var i=0;i<CATS.length;i++)if(CATS[i][1].test(p))return CATS[i][0];return 'Other'}
function segment(t){for(var i=0;i<SEGMENTS.length;i++)if(SEGMENTS[i][1].test(t))return SEGMENTS[i][0];return '🎯 Other Govt'}
function size(p){var m=String(p).match(/(\d+(?:\.\d+)?)\s*(?:mm|cm|in|inch)?\s*[x\u00D7*]\s*(\d+(?:\.\d+)?)\s*(mm|cm|inch|in)?/i);return m?m[1]+'\u00D7'+m[2]+(m[3]?m[3].toLowerCase():''):''}
function brand(p){var up=String(p).toUpperCase();for(var i=0;i<BRANDS.length;i++){if(up.indexOf(BRANDS[i].toUpperCase())===0)return BRANDS[i];if(up.indexOf(BRANDS[i].toUpperCase()+' ')>=0)return BRANDS[i]}var m=String(p).match(/^([A-Z][A-Za-z0-9\-]{2,20})/);return m?m[1].toUpperCase():'(unbranded)'}
function nk(k){return String(k).replace(/[\u2013\u2014]/g,'-').replace(/\u00A0/g,' ').replace(/\s+/g,' ').trim()}
function ct(s){return String(s==null?'':s).replace(/\s{2,}/g,' ').trim()}
function td(s){return String(s==null?'':s).replace(/[-\s]+$/,'').trim()}
function gst(s){return String(s==null?'':s).replace(/\s*\(R\)\s*$/i,'').trim().toUpperCase()}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n}
function parseState(a){a=String(a||'');var m=a.match(/([A-Z][A-Z &\.]{3,})-\d{6}/);if(m)return m[1].trim();m=a.match(/,\s*([A-Z][A-Za-z &\.]+)-\d{6}/);return m?m[1].trim().toUpperCase():'Unknown'}
function parseDate(v){
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  if(typeof v==='number')return new Date(Date.UTC(1899,11,30)+v*864e5).toISOString().slice(0,10);
  var s=String(v||'').trim();if(!s)return'';
  var m=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/);
  if(m){var mo='janfebmaraprmayjunjulaugsepoctnovdec';var i=mo.indexOf(m[2].toLowerCase());if(i>=0&&i%3===0){var mm=String(i/3+1);if(mm.length<2)mm='0'+mm;var dd=m[1];if(dd.length<2)dd='0'+dd;var yy=m[3].length===2?'20'+m[3]:m[3];return yy+'-'+mm+'-'+dd}}
  var d=new Date(s);return isNaN(d)?'':d.toISOString().slice(0,10)
}

/* Find a value in the raw row for a given spec key (fuzzy header match) */
function specValue(raw, key){
  var patterns = SPEC_MAP[key];
  if (!patterns) return '';
  for (var k in raw){
    var low = String(k).toLowerCase();
    for (var i = 0; i < patterns.length; i++){
      if (low.indexOf(patterns[i]) >= 0) return ct(raw[k]);
    }
  }
  return '';
}

function cleanRow(r){
  var q=num(r['Ordered Quantity']),u=num(r['Unit Price']),t=num(r['Price (Inclusive of All Duties & Taxes) - INR']);
  var p=ct(r['Product Name']),pdf=ct(r['One actual sample PDF']||r['Sample PDF']||r['PDF']||'');
  var buyerTxt=ct(r['Buyer Designation'])+' '+ct(r['Buyer Address']);
  var flags=[];
  if(!q||q<=0)flags.push('qty_invalid');
  if(!u||u<=0)flags.push('unit_invalid');
  if(!t||t<=0)flags.push('total_invalid');

  /* Extract spec fields */
  var modeSpec = specValue(r, 'mode');
  var src = 'Unknown';
  if (modeSpec){
    if (/direct|gemc/i.test(modeSpec)) src = 'Direct';
    else if (/bid|gem\b|tender|reverse/i.test(modeSpec)) src = 'Bid';
  } else if (/^GEMC-/i.test(pdf)) src = 'Direct';
  else if (/^GEM-/i.test(pdf)) src = 'Bid';

  return{
    date:parseDate(r['Generated Date']),bd:ct(r['Buyer Designation']),bp:td(r['Buyer Contact No']),
    bg:gst(r['Buyer GSTIN']),bs:parseState(r['Buyer Address']),
    seller:ct(r['Seller Company Name']),sg:gst(r['Seller GSTIN']),ss:parseState(r['Seller Address']),
    prod:p,cat:cat(p),size:size(p),brand:brand(p),
    qty:q,unit:u,total:t>0?t:(q>0&&u>0?q*u:0),src:src,seg:segment(buyerTxt),
    // Spec fields
    specMode: modeSpec || src,
    specPtype: specValue(r, 'ptype'),
    specMaterial: specValue(r, 'material'),
    specPrinting: specValue(r, 'printing'),
    specAdhesive: specValue(r, 'adhesive'),
    specFinish: specValue(r, 'finish'),
    specFormat: specValue(r, 'format'),
    specDie: specValue(r, 'die'),
    specGsm: num(specValue(r, 'gsm')),
    specSize: specValue(r, 'size') || size(p),
    specPack: num(specValue(r, 'pack')),
    flags:flags
  }
}
function rowKey(r){return[r.date,r.bg,r.sg,r.prod,r.qty,r.total].join('|')}

var sk=function(r){return r.sg||r.seller};
var sum=function(l,k){var s=0;for(var i=0;i<l.length;i++)s+=(l[i][k]||0);return s};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fm(n){if(n>=1e7)return'\u20B9'+(n/1e7).toFixed(2)+' Cr';if(n>=1e5)return'\u20B9'+(n/1e5).toFixed(2)+' L';return'\u20B9'+Math.round(n).toLocaleString('en-IN')}
function r2(n){return'\u20B9'+(n>=100?Math.round(n):n.toFixed(2))}
function ago(d){return Math.round((Date.now()-new Date(d))/864e5)}
function pc(x){return(x*100).toFixed(1)+'%'}
function L(n){return Math.round(n).toLocaleString('en-IN')}
function grp(list,f){var m=new Map();for(var i=0;i<list.length;i++){var k=f(list[i]);if(!k)continue;if(!m.has(k))m.set(k,[]);m.get(k).push(list[i])}return m}
function qt(a,p){if(!a.length)return 0;return a[Math.min(a.length-1,Math.floor(a.length*p))]}
function ps(list){var a=[];for(var i=0;i<list.length;i++){if(list[i].unit>0&&list[i].flags.indexOf('unit_invalid')<0)a.push(list[i].unit)}a.sort(function(x,y){return x-y});return{n:a.length,p10:qt(a,.1),p25:qt(a,.25),p40:qt(a,.4),p50:qt(a,.5),p75:qt(a,.75),p90:qt(a,.9),a:a}}
function med(list){return ps(list).p50}
function T(headers,rows){
  var h='<div class="sc"><table><thead><tr>';
  for(var i=0;i<headers.length;i++)h+='<th>'+headers[i]+'</th>';
  h+='</tr></thead><tbody>';
  for(var j=0;j<rows.length;j++){h+='<tr>';for(var k=0;k<rows[j].length;k++)h+='<td>'+rows[j][k]+'</td>';h+='</tr>'}
  return h+'</tbody></table></div>'
}
function pill(t,c){return'<span class="p '+(c||'')+'">'+t+'</span>'}

var _nc={seller:{},buyer:{}};
function rebuildNameCaches(){
  _nc={seller:{},buyer:{}};
  for(var i=0;i<F.length;i++){
    var r=F[i];
    var sK=sk(r); if(sK&&!_nc.seller[sK])_nc.seller[sK]=r.seller||sK;
    var bK=r.bg||r.bd; if(bK&&!_nc.buyer[bK])_nc.buyer[bK]=r.bd||r.bg||bK;
  }
}
function sellerName(g){return _nc.seller[g]||g}
function buyerName(g){return _nc.buyer[g]||g}

/* =========================================================
   ANALYTICS
   ========================================================= */
function buyersList(rows){
  var pm=new Map();grp(rows,function(r){return r.prod}).forEach(function(l,p){pm.set(p,med(l))});
  var out=[];
  grp(rows,function(r){return r.bg||r.bd}).forEach(function(l,k){
    l.sort(function(a,b){return a.date.localeCompare(b.date)});
    var last=l[l.length-1],val=sum(l,'total');
    var ds=[],seen={};for(var i=0;i<l.length;i++)if(!seen[l[i].date]){seen[l[i].date]=1;ds.push(l[i].date)}
    var cyc=ds.length>2?Math.round((new Date(ds[ds.length-1])-new Date(ds[0]))/864e5/(ds.length-1)):0;
    var dsl=ago(last.date);
    var due=cyc?Math.round((new Date(last.date).getTime()+cyc*864e5-Date.now())/864e5):null;
    var ix=[];for(var j=0;j<l.length;j++){var mp=pm.get(l[j].prod);if(l[j].unit>0&&mp>0&&l[j].flags.indexOf('unit_invalid')<0)ix.push(l[j].unit/mp)}
    var pidx=ix.length?ix.reduce(function(a,b){return a+b},0)/ix.length*100:0;
    var selArr=[];grp(l,function(r){return r.seller}).forEach(function(v,kk){selArr.push([kk,v.length])});selArr.sort(function(a,b){return b[1]-a[1]});
    var cats=[];grp(l,function(r){return r.cat}).forEach(function(v,kk){cats.push([kk,sum(v,'total')])});cats.sort(function(a,b){return b[1]-a[1]});
    var segs=[];grp(l,function(r){return r.seg}).forEach(function(v,kk){segs.push([kk,sum(v,'total')])});segs.sort(function(a,b){return b[1]-a[1]});
    var conf = ds.length>=3?'HIGH':ds.length===2?'MED':'LOW';
    out.push({k:k,name:last.bd||k,state:last.bs,phone:last.bp,orders:l.length,val:val,avg:val/l.length,aq:Math.round(sum(l,'qty')/l.length),cyc:cyc,dsl:dsl,due:due,pidx:pidx,sel:selArr.map(function(x){return x[0]}),cat:cats[0]?cats[0][0]:'',seg:segs[0]?segs[0][0]:'',last:last.date,dates:ds.length,conf:conf,rows:l});
  });
  var vals=out.map(function(b){return b.val}).sort(function(a,b){return a-b});
  var whale=qt(vals,.9);
  out.forEach(function(b){
    b.tags=[];
    if(b.due!=null&&b.due<=14&&b.orders>1)b.tags.push(['REORDER WINDOW','r']);
    if(b.pidx>=115&&b.orders>0)b.tags.push(['PAID 15%+ ABOVE MED','a']);
    if(b.val>=whale)b.tags.push(['TOP DECILE SPEND','g']);
    if(b.orders>=4)b.tags.push(['REPEAT','g']);
    if(b.orders===1)b.tags.push(['SINGLE PURCHASE','']);
    if(!b.tags.length)b.tags.push(['OCCASIONAL','']);
  });
  return out.sort(function(a,b){return b.val-a.val})
}

function scoreBuyer(b){
  var rec = b.dsl<30?100:b.dsl<90?75:b.dsl<180?45:b.dsl<365?20:5;
  var freq = Math.min(100, b.orders*18);
  var val = Math.min(100, Math.log10(b.val+1)*12);
  var fit = 70;
  var comp = b.sel.length<=1?100:b.sel.length<=3?70:40;
  var conf = b.conf==='HIGH'?100:b.conf==='MED'?60:30;
  var total = (rec*W.rec + freq*W.freq + val*W.val + fit*W.fit + comp*W.comp + conf*W.conf)/(W.rec+W.freq+W.val+W.fit+W.comp+W.conf);
  return Math.round(total);
}

function sellersList(rows){
  var tot=sum(rows,'total'),pm=new Map(),now=Date.now();
  grp(rows,function(r){return r.prod}).forEach(function(l,p){pm.set(p,med(l))});
  var out=[];
  grp(rows,sk).forEach(function(l,k){
    var v=sum(l,'total');
    var ix=[];for(var i=0;i<l.length;i++){var mp=pm.get(l[i].prod);if(l[i].unit>0&&mp>0&&l[i].flags.indexOf('unit_invalid')<0)ix.push(l[i].unit/mp)}
    var pidx=ix.length?ix.reduce(function(a,b){return a+b},0)/ix.length*100:0;
    var rec=0,prev=0;
    for(var j=0;j<l.length;j++){var age=(now-new Date(l[j].date))/864e5;if(age<=90)rec+=l[j].total;else if(age>90&&age<=180)prev+=l[j].total}
    var catArr=[];grp(l,function(r){return r.cat}).forEach(function(v,kk){catArr.push([kk,sum(v,'total')])});catArr.sort(function(a,b){return b[1]-a[1]});
    var segArr=[];grp(l,function(r){return r.seg}).forEach(function(v,kk){segArr.push([kk,sum(v,'total')])});segArr.sort(function(a,b){return b[1]-a[1]});
    var states=new Set(),buyerSet=new Set();
    for(var m=0;m<l.length;m++){if(l[m].bs&&l[m].bs!=='Unknown')states.add(l[m].bs);if(l[m].bg)buyerSet.add(l[m].bg)}
    var bid=0,dir=0;for(var n=0;n<l.length;n++){if(l[n].src==='Bid')bid++;if(l[n].src==='Direct')dir++}
    out.push({k:k,name:l[0].seller,orders:l.length,v:v,share:tot?v/tot:0,buyers:buyerSet.size,states:states.size,home:l[0].ss,aq:Math.round(sum(l,'qty')/l.length),pidx:pidx,cat:catArr[0]?catArr[0][0]:'',seg:segArr[0]?segArr[0][0]:'',trend:prev?(rec-prev)/prev:(rec?1:0),bid:bid,dir:dir});
  });
  return out.sort(function(a,b){return b.v-a.v})
}

function catsList(rows){
  var out=[];
  grp(rows,function(r){return r.cat}).forEach(function(l,c){
    var s=ps(l),bs=new Set(),ss=new Set();
    for(var i=0;i<l.length;i++){if(l[i].bg)bs.add(l[i].bg);ss.add(sk(l[i]))}
    out.push({c:c,v:sum(l,'total'),n:l.length,b:bs.size,s:ss.size,p50:s.p50,p25:s.p25,aq:Math.round(sum(l,'qty')/l.length)});
  });
  return out.sort(function(a,b){return b.v-a.v})
}

function segList(rows){
  var tot=sum(rows,'total'),out=[];
  grp(rows,function(r){return r.seg}).forEach(function(l,s){
    var bs=new Set(),ss=new Set(),stSet=new Set();
    for(var i=0;i<l.length;i++){if(l[i].bg)bs.add(l[i].bg);ss.add(sk(l[i]));if(l[i].bs&&l[i].bs!=='Unknown')stSet.add(l[i].bs)}
    var topSt=[];grp(l,function(r){return r.bs!=='Unknown'?r.bs:null}).forEach(function(x,kk){topSt.push([kk,sum(x,'total')])});topSt.sort(function(a,b){return b[1]-a[1]});
    var topCat=[];grp(l,function(r){return r.cat}).forEach(function(x,kk){topCat.push([kk,sum(x,'total')])});topCat.sort(function(a,b){return b[1]-a[1]});
    var samples=l.slice(0,3).map(function(r){return r.bd}).join(' · ');
    out.push({s:s,v:sum(l,'total'),n:l.length,share:tot?sum(l,'total')/tot:0,b:bs.size,sl:ss.size,states:stSet.size,avg:sum(l,'total')/l.length,topState:topSt[0]?topSt[0][0]:'',topCat:topCat[0]?topCat[0][0]:'',sample:samples});
  });
  return out.sort(function(a,b){return b.v-a.v})
}

function geoList(rows){
  var m=grp(rows,function(r){return r.bs!=='Unknown'?r.bs:null});
  var mx=1;m.forEach(function(l){var v=sum(l,'total');if(v>mx)mx=v});
  var out=[];
  m.forEach(function(l,s){
    var v=sum(l,'total');
    var sellerArr=[];grp(l,sk).forEach(function(x){sellerArr.push(sum(x,'total'))});sellerArr.sort(function(a,b){return b-a});
    var t1=v?sellerArr[0]/v:0;
    var bs=new Set();for(var i=0;i<l.length;i++)if(l[i].bg)bs.add(l[i].bg);
    var locCount=0;for(var j=0;j<l.length;j++)if(l[j].ss===s)locCount++;
    var loc=locCount/l.length,pr=ps(l);
    out.push({s:s,v:v,n:l.length,b:bs.size,sl:sellerArr.length,p50:pr.p50,avg:v/l.length,t1:t1,loc:loc,ease:Math.round(50*v/mx+30*(1-t1)+20*Math.min(bs.size/20,1))});
  });
  return out.sort(function(a,b){return b.ease-a.ease})
}

function fiscalQ4(rows){var t=sum(rows,'total');if(!t)return 0;var q=0;for(var i=0;i<rows.length;i++){var m=+rows[i].date.slice(5,7)-1;if(m===0||m===1||m===2)q+=rows[i].total}return q/t}

function dqReport(rows){
  var issues=[];
  var missingPrice=0,zeroQty=0,negativeQty=0,badDate=0,noSeller=0,noBuyer=0,noProduct=0,outlierPrice=0;
  var prices=[];
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(!r.total||r.total<=0)missingPrice++;
    if(r.qty<=0)zeroQty++;
    if(r.qty<0)negativeQty++;
    if(!r.date||r.date.length!==10)badDate++;
    if(!r.seller)noSeller++;
    if(!r.bg&&!r.bd)noBuyer++;
    if(!r.prod)noProduct++;
    if(r.unit>0)prices.push(r.unit);
  }
  prices.sort(function(a,b){return a-b});
  var p50=qt(prices,.5),p99=qt(prices,.99);
  for(var j=0;j<rows.length;j++) if(rows[j].unit>0&&rows[j].unit>p99*3)outlierPrice++;
  issues.push(['Missing / zero price (total)',missingPrice,'r']);
  issues.push(['Zero quantity',zeroQty,'a']);
  issues.push(['Negative quantity',negativeQty,'r']);
  issues.push(['Invalid or missing date',badDate,'r']);
  issues.push(['Missing seller name',noSeller,'a']);
  issues.push(['Missing buyer identifier',noBuyer,'r']);
  issues.push(['Missing product name',noProduct,'a']);
  issues.push(['Unit price >3× 99th pct',outlierPrice,'a']);
  return{issues:issues,totalRows:rows.length,recon:sum(rows,'total'),p50:p50};
}

   TAB 5 — PRODUCT SPECS (NEW)
   ========================================================= */
function vSpec(){
  var rows=F;
  if(!rows.length)return '<div class="card empty">Upload data with spec columns to see this view.</div>';

  // Check if spec data exists
  var specFields = ['specPtype','specMaterial','specPrinting','specAdhesive','specFinish','specFormat','specDie'];
  var hasSpec = false;
  for (var i = 0; i < rows.length && !hasSpec; i++){
    for (var j = 0; j < specFields.length; j++){
      if (rows[i][specFields[j]]){ hasSpec = true; break; }
    }
  }

  var tot = sum(rows, 'total');

  var html = '';
  html += '<div class="hero"><h2>🏷️ Product Specs — what combination actually sells</h2>';
  html += '<div class="kpis">';
  html += '<div class="kpi"><b>'+rows.length.toLocaleString('en-IN')+'</b><span>Orders in slice</span></div>';
  html += '<div class="kpi"><b>'+fm(tot)+'</b><span>Value</span></div>';
  html += '<div class="kpi"><b>'+r2(med(rows))+'</b><span>Median unit</span></div>';
  html += '<div class="kpi"><b>'+ps(rows).n+'</b><span>Rows with valid price</span></div>';
  html += '</div></div>';

  if (!hasSpec){
    html += '<div class="warn">Your uploaded data does not contain spec columns (Product Type / Material / Printing / Adhesive / Finish / Format / Die / GSM / Size / Pack). The dashboard will still work with category+size from the Product Name.</div>';
  }

  /* Helper — breakdown for a spec field, clickable chips + counts */
  function specBreak(field, label, icon){
    var counts = new Map();
    var values = 0;
    for (var i = 0; i < rows.length; i++){
      var v = rows[i][field];
      if (!v) continue;
      values++;
      counts.set(v, (counts.get(v) || 0) + 1);
    }
    if (!values) return '';
    var list = [];
    counts.forEach(function(n, k){ list.push([k, n]); });
    list.sort(function(a,b){ return b[1] - a[1]; });
    var top = list.slice(0, 12);

    var html2 = '<div class="card"><h3>'+icon+' '+label+' <span class="mu">('+values+' rows with value)</span></h3>';
    html2 += '<div>';
    top.forEach(function(x){
      var val = String(x[0]).replace(/'/g, "\\'");
      html2 += '<span class="chip'+(MX[field]===x[0]?' on':'')+'" onclick="MX.'+field+'=\''+val+'\';TAB=\'spec\';show()">'+esc(String(x[0]).slice(0,40))+' <span style="opacity:.6">· '+x[1]+'</span></span>';
    });
    html2 += '</div></div>';
    return html2;
  }

  html += specBreak('specPtype', 'Product Type', '🏷️');
  html += specBreak('specMaterial', 'Material Type', '🧱');
  html += specBreak('specPrinting', 'Printing Compatibility', '🖨️');
  html += specBreak('specAdhesive', 'Adhesive Type', '📎');
  html += specBreak('specFinish', 'Surface Finish', '✨');
  html += specBreak('specFormat', 'Label Format', '📄');
  html += specBreak('specDie', 'Die-Cut Type', '✂️');
  html += specBreak('specSize', 'Label Size (W×H)', '📐');

  /* GSM distribution */
  var gsms = [];
  for (var i = 0; i < rows.length; i++) if (rows[i].specGsm > 0) gsms.push(rows[i].specGsm);
  if (gsms.length){
    gsms.sort(function(a,b){ return a-b; });
    html += '<div class="card"><h3>📊 GSM distribution</h3>';
    html += T(['Percentile','GSM'], [
      ['P10', qt(gsms, .1)],
      ['P25', qt(gsms, .25)],
      ['P50 · median', qt(gsms, .5)],
      ['P75', qt(gsms, .75)],
      ['P90', qt(gsms, .9)]
    ]);
    html += '<div class="mu">'+gsms.length+' rows have GSM data.</div></div>';
  }

  /* Pack quantity distribution */
  var packs = [];
  for (var i = 0; i < rows.length; i++) if (rows[i].specPack > 0) packs.push(rows[i].specPack);
  if (packs.length){
    packs.sort(function(a,b){ return a-b; });
    html += '<div class="card"><h3>📦 Pack quantity distribution</h3>';
    html += T(['Percentile','Labels per packet'], [
      ['P10', qt(packs, .1)],
      ['P25', qt(packs, .25)],
      ['P50 · median', qt(packs, .5)],
      ['P75', qt(packs, .75)],
      ['P90', qt(packs, .9)]
    ]);
    html += '<div class="mu">'+packs.length+' rows have pack data.</div></div>';
  }

  /* Best performing spec combos — group by product type + material + printing */
  var combos = new Map();
  for (var i = 0; i < rows.length; i++){
    var r = rows[i];
    if (!r.specPtype && !r.specMaterial && !r.specPrinting) continue;
    var key = [r.specPtype||'—', r.specMaterial||'—', r.specPrinting||'—'].join(' · ');
    if (!combos.has(key)) combos.set(key, { n:0, v:0, orders:[] });
    var c = combos.get(key);
    c.n++;
    c.v += r.total;
    c.orders.push(r);
  }
  var comboList = [];
  combos.forEach(function(c, k){ comboList.push([k, c]); });
  comboList.sort(function(a,b){ return b[1].v - a[1].v; });

  if (comboList.length){
    html += '<h2>🏆 Top combinations (Type · Material · Printing)</h2>';
    html += '<div class="card">';
    html += T(['Combination','Orders','Value','Median unit'],
      comboList.slice(0, 20).map(function(c){
        return [
          esc(c[0].slice(0, 60)),
          c[1].n,
          fm(c[1].v),
          r2(med(c[1].orders))
        ];
      }));
    html += '</div>';
  }

  /* Active spec filters — how to know you're seeing a filtered slice */
  var activeSpec = 0;
  for (var k in MX) if (k.indexOf('spec') === 0 && MX[k]) activeSpec++;
  if (activeSpec){
    html = '<div class="info"><b>You have '+activeSpec+' spec filter'+(activeSpec>1?'s':'')+' active.</b> Showing sliced view. <a href="javascript:mxClearAll();show()" style="color:var(--pr);font-weight:600">Clear spec filters →</a></div>' + html;
  }

  return html;
}

function vAnalyst(){
  var R=mxRows(F);
  function uniq(fn){var s=new Set();for(var i=0;i<F.length;i++){var v=fn(F[i]);if(v&&v!=='Unknown'&&v!=='(no size)')s.add(v)}return Array.from(s).sort()}
  function nameDropdown(dim,keyFn,nameLookup,label){
    var counts=new Map();
    for(var i=0;i<F.length;i++){var k=keyFn(F[i]);if(!k)continue;counts.set(k,(counts.get(k)||0)+1)}
    var list=[];
    counts.forEach(function(n,k){list.push({k:k,name:nameLookup(k),n:n})});
    list.sort(function(a,b){return b.n-a.n});
    var opts='<option value="">All</option>';
    list.slice(0,300).forEach(function(x){
      opts+='<option value="'+esc(x.k)+'"'+(MX[dim]===x.k?' selected':'')+'>'+esc(String(x.name).slice(0,48))+' ('+x.n+')</option>';
    });
    return '<label>'+label+' <select onchange="MX.'+dim+'=this.value;show()">'+opts+'</select></label>'
  }
  function opts(dim,values){
    var o='<option value="">All</option>';
    values.slice(0,400).forEach(function(v){
      o+='<option value="'+esc(v)+'"'+(MX[dim]===v?' selected':'')+'>'+esc(String(v).slice(0,55))+'</option>'
    });
    return o
  }

  var bar='<div class="card">';
  bar+='<h3>🔬 Master Analyst</h3>';
  bar+='<div class="mu">Combine any filters (AND).</div>';
  bar+='<div class="bar" style="margin-top:10px">';
  bar+='<label>State <select onchange="MX.state=this.value;show()">'+opts('state',uniq(function(r){return r.bs}))+'</select></label>';
  bar+='<label>Segment <select onchange="MX.seg=this.value;show()">'+opts('seg',SEGMENTS.map(function(s){return s[0]}))+'</select></label>';
  bar+='<label>Type <select onchange="MX.cat=this.value;show()">'+opts('cat',uniq(function(r){return r.cat}))+'</select></label>';
  bar+='<label>Size <select onchange="MX.size=this.value;show()">'+opts('size',uniq(function(r){return r.size}))+'</select></label>';
  bar+='<label>Brand <select onchange="MX.brand=this.value;show()">'+opts('brand',uniq(function(r){return r.brand}))+'</select></label>';
  bar+=nameDropdown('seller',sk,sellerName,'Seller');
  bar+=nameDropdown('buyer',function(r){return r.bg||r.bd},buyerName,'Buyer');
  bar+='</div>';

  /* Collapsed advanced filters */
  var specFields = [
    ['specPtype','Product Type'],['specMaterial','Material'],['specPrinting','Printing'],
    ['specAdhesive','Adhesive'],['specFinish','Finish'],['specFormat','Format'],
    ['specDie','Die-Cut'],['specSize','Label Size']
  ];
  var hasAnySpec = false;
  for (var i = 0; i < F.length; i++){ if (F[i].specPtype || F[i].specMaterial || F[i].specPrinting){ hasAnySpec = true; break; } }

  if (hasAnySpec){
    bar += '<details class="spec"><summary>⚙️ More spec filters ('+specFields.length+' fields)</summary><div class="bar">';
    specFields.forEach(function(sf){
      bar += '<label>'+sf[1]+' <select onchange="MX.'+sf[0]+'=this.value;show()">'+opts(sf[0],uniq(function(r){return r[sf[0]]}))+'</select></label>';
    });
    bar += '</div></details>';
  }

  bar+='<div class="bar" style="margin-top:10px">';
  bar+='<button class="s" onclick="mxClearAll()">✕ Clear ('+mxActiveCount()+')</button>';
  bar+='<button class="s" onclick="mxExportCSV()">⬇ Export slice</button>';
  bar+='</div>';

  if(mxActiveCount()){
    bar+='<div class="crumbs" style="margin-top:10px"><b class="mu">Active:</b>';
    for(var k in MX){
      if(!MX[k])continue;
      var nm=MX[k];
      if(k==='seller')nm=sellerName(MX[k]);
      else if(k==='buyer')nm=buyerName(MX[k]);
      var friendly = k.replace('spec','');
      bar+='<span class="crumb" onclick="mxClearOne(\''+k+'\')">'+friendly+': '+esc(String(nm).slice(0,35))+' <span class="x">✕</span></span>';
    }
    bar+='</div>';
  }
  bar+='</div>';

  if(!R.length)return bar+'<div class="card empty">No records match this combination.</div>';

  var tot=sum(R,'total'),n=R.length;
  var nBuyers=new Set(R.map(function(r){return r.bg||r.bd})).size;
  var nSellers=new Set(R.map(function(r){return sk(r)})).size;

  var kpis='<div class="card"><div class="kpis">';
  kpis+='<div class="kpi"><b>'+fm(tot)+'</b><span>Slice value</span></div>';
  kpis+='<div class="kpi"><b>'+n+'</b><span>Orders</span></div>';
  kpis+='<div class="kpi"><b>'+fm(tot/n)+'</b><span>Avg order</span></div>';
  kpis+='<div class="kpi"><b>'+r2(med(R))+'</b><span>Median unit</span></div>';
  kpis+='<div class="kpi"><b>'+nBuyers+'</b><span>Buyers</span></div>';
  kpis+='<div class="kpi"><b>'+nSellers+'</b><span>Sellers</span></div>';
  kpis+='</div></div>';

  function breakdown(dim,keyFn,displayFn,label){
    var m=grp(R,keyFn),rows=[];
    m.forEach(function(l,k){
      var v=sum(l,'total');
      var buyers=new Set(),sellers=new Set(),states=new Set();
      for(var i=0;i<l.length;i++){if(l[i].bg)buyers.add(l[i].bg);sellers.add(sk(l[i]));if(l[i].bs&&l[i].bs!=='Unknown')states.add(l[i].bs)}
      var display=displayFn?displayFn(k):k;
      rows.push({k:k,display:display,v:v,n:l.length,buyers:buyers.size,sellers:sellers.size,states:states.size,avg:v/l.length,p50:med(l),share:tot?v/tot:0});
    });
    rows.sort(function(a,b){return b.v-a.v});
    var body=rows.slice(0,35).map(function(x){
      var key=String(x.k).replace(/'/g,"\\'");
      var link=dim?'<a href="javascript:MX.'+dim+'=\''+key+'\';show()" style="color:var(--pr);font-weight:600;text-decoration:none">'+esc(String(x.display).slice(0,50))+'</a>':'<b>'+esc(String(x.display).slice(0,50))+'</b>';
      return[link,fm(x.v),pc(x.share),x.n,x.buyers,x.sellers,L(x.avg),r2(x.p50)]
    });
    return '<div class="card"><h3>'+label+' <span class="mu">('+rows.length+')</span></h3>'+
      T(['Name'+((dim)?' — click':''),'Revenue','Share','Orders','Buyers','Sellers','Avg ₹','Median ₹'],body)+
      '</div>'
  }

  var html=bar+kpis;
  html+='<div class="grid">';
  html+=breakdown('state',function(r){return r.bs!=='Unknown'?r.bs:null},null,'🗺️ States');
  html+=breakdown('seg',function(r){return r.seg},null,'🎯 Segments');
  html+=breakdown('buyer',function(r){return r.bg||r.bd},buyerName,'👥 Buyers');
  html+=breakdown('seller',function(r){return sk(r)},sellerName,'🥊 Sellers');
  html+=breakdown('cat',function(r){return r.cat},null,'🏷️ Types');
  html+=breakdown('size',function(r){return r.size},null,'📐 Sizes');
  html+='</div>';

  var sample=R.slice().sort(function(a,b){return b.total-a.total}).slice(0,80);
  html+='<div class="card"><h3>📋 Sample (top 80)</h3>';
  html+=T(['Date','Buyer','Segment','State','Seller','Type','Size','Product','Qty','Unit ₹','Total ₹'],
    sample.map(function(r){return[r.date,esc((r.bd||r.bg).slice(0,26)),esc(r.seg.slice(0,18)),esc(r.bs),esc(r.seller.slice(0,24)),esc(r.cat),esc(r.size),esc(r.prod.slice(0,40)),L(r.qty),r.unit,L(r.total)]}));
  html+='</div>';
  return html
}

function mk(id,cfg){
  var el=$(id);if(!el)return;
  if(CH[id]){try{CH[id].destroy()}catch(e){}CH[id]=null}
  Chart.defaults.color=getComputedStyle(document.body).color;
  CH[id]=new Chart(el,cfg)
}

function show(){
  Object.keys(CH).forEach(function(id){if(CH[id]){try{CH[id].destroy()}catch(e){}CH[id]=null}});
  rebuildNameCaches();
  var h='';
  Object.keys(TABS).forEach(function(k){
    var label=TABS[k]+(k==='mx'&&mxActiveCount()?' ('+mxActiveCount()+')':'');
    h+='<button class="tab'+(k===TAB?' on':'')+'" data-t="'+k+'">'+label+'</button>'
  });
  $('tabs').innerHTML=h;
  $('view').innerHTML=F.length?V[TAB][0]():'<div class="card empty">No records match the current filter.</div>';
  if(F.length&&V[TAB][1])V[TAB][1]()
}

function apply(){
  var f=$('from').value,t=$('to').value,m=MODE;
  F=ALL.filter(function(r){
    if(f&&r.date<f)return false;
    if(t&&r.date>t)return false;
    if(m&&r.src!==m)return false;
    return true
  });
  show()
}

function init(){
  $('app').hidden=!ALL.length;
  if(!ALL.length)return;
  var cnt=new Map();
  ALL.forEach(function(r){var k=sk(r);cnt.set(k,(cnt.get(k)||0)+1)});
  var all=Array.from(cnt.entries()).sort(function(a,b){return b[1]-a[1]});
  function nameOf(k){for(var i=0;i<ALL.length;i++)if(sk(ALL[i])===k)return ALL[i].seller;return k}
  var saved=ls.g('gem_me')||'';
  ME=saved&&cnt.has(saved)?saved:'';
  var h='<option value=""'+(ME?'':' selected')+'>All sellers (market view)</option>';
  all.forEach(function(p){h+='<option value="'+esc(p[0])+'"'+(p[0]===ME?' selected':'')+'>'+esc(nameOf(p[0]).slice(0,50))+' ('+p[1]+')</option>'});
  $('me').innerHTML=h;
  var dates=ALL.map(function(r){return r.date}).filter(Boolean).sort();
  $('from').value=dates[0];
  $('to').value=dates[dates.length-1];
  apply()
}

function msg(t,e){$('st').textContent=t;$('st').style.color=e?'var(--r)':'var(--g)'}
function dl(txt,name,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},500)}

  var B1=buyersList(F).map(function(b){return{Score:scoreBuyer(b),Buyer:b.name,GSTIN:b.k,State:b.state,Segment:b.seg,Confidence:b.conf,DistinctDates:b.dates,Phone:b.phone,Orders:b.orders,Total:b.val,AvgOrder:Math.round(b.avg),CycleDays:b.cyc,DueDays:b.due,PriceIdx:Math.round(b.pidx),Sellers:b.sel.length,Tags:b.tags.map(function(t){return t[0]}).join('; ')}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(B1),'Opportunities');
  var S1=sellersList(F).map(function(s){return{Seller:s.name,GSTIN:s.k,HomeState:s.home,Segment:s.seg,Orders:s.orders,Revenue:s.v,Share:(s.share*100).toFixed(2)+'%',Buyers:s.buyers,PriceIdx:Math.round(s.pidx),Trend:(s.trend*100).toFixed(1)+'%'}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S1),'Sellers');
  var Sg=segList(F).map(function(s){return{Segment:s.s,Revenue:s.v,Orders:s.n,Share:(s.share*100).toFixed(2)+'%',Buyers:s.b,TopState:s.topState,TopCategory:s.topCat}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Sg),'Segments');
  var G1=geoList(F).map(function(g){return{State:g.s,EntryScore:g.ease,MarketValue:g.v,Orders:g.n,Buyers:g.b,Sellers:g.sl,Median:Math.round(g.p50)}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(G1),'States');
  var recs=F.map(function(r){return{Date:r.date,Buyer:r.bd,GSTIN:r.bg,Segment:r.seg,State:r.bs,Seller:r.seller,Cat:r.cat,Size:r.size,Brand:r.brand,Product:r.prod,Qty:r.qty,UnitPrice:r.unit,Total:r.total,Source:r.src,ProductType:r.specPtype,Material:r.specMaterial,Printing:r.specPrinting,Adhesive:r.specAdhesive,Finish:r.specFinish,Format:r.specFormat,DieCut:r.specDie,GSM:r.specGsm,SpecSize:r.specSize,Pack:r.specPack,Flags:r.flags.join(';')}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(recs),'Records');
  XLSX.writeFile(wb,'gem_consultant_'+new Date().toISOString().slice(0,10)+'.xlsx')
}

function handle(f){
  if(!f)return;
  msg('Reading '+f.name+' …');
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      var best=null;
      for(var i=0;i<wb.SheetNames.length;i++){
        var name=wb.SheetNames[i],rows;
        try{rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:''})}catch(err){continue}
        if(!rows.length)continue;
        var h=0;while(h<rows.length&&rows[h].filter(function(c){return String(c).trim()}).length<3)h++;
        if(h>=rows.length)continue;
        var nr=rows[h].map(nk).map(function(x){return String(x).toLowerCase().replace(/[^a-z0-9]/g,'')});
        var ne=EXP.map(function(x){return x.toLowerCase().replace(/[^a-z0-9]/g,'')});
        var m=ne.filter(function(x){return nr.indexOf(x)>=0}).length;
        if(!best||m>best.m)best={n:name,m:m}
      }
      if(!best||best.m<3){msg('No GeM sheet found.',1);return}
      var raw=XLSX.utils.sheet_to_json(wb.Sheets[best.n],{defval:'',raw:false}).map(function(r){var o={};for(var k in r)o[nk(k)]=r[k];return o});
      var cleaned=raw.map(cleanRow).filter(function(r){return r.seller&&r.date});
      if(!cleaned.length){msg('0 valid rows.',1);return}
      var seen=new Set(ALL.map(rowKey)),add=0;
      for(var j=0;j<cleaned.length;j++){var k2=rowKey(cleaned[j]);if(!seen.has(k2)){seen.add(k2);ALL.push(cleaned[j]);add++}}
      ls.s(KEY,JSON.stringify(ALL));
      msg('✅ '+cleaned.length+' cleaned · '+add+' new · master '+ALL.length.toLocaleString('en-IN'));
      init()
    }catch(x){console.error(x);msg('Error: '+x.message,1)}
  };
  rd.readAsArrayBuffer(f)
}

(function wireUpload(){
  var dz=$('drop'),fi=$('file');
  if(!dz||!fi)return;
  dz.addEventListener('click',function(e){if(e.target!==fi)e.preventDefault();fi.click()});
  fi.addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(f)handle(f);e.target.value=''});
  fi.addEventListener('click',function(e){e.stopPropagation()});
  ['dragenter','dragover'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();e.stopPropagation();dz.classList.add('over')})});
  ['dragleave','drop'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();e.stopPropagation();dz.classList.remove('over')})});
  dz.addEventListener('drop',function(e){var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handle(f)});
})();

$('prt').addEventListener('click',function(){window.print()});
$('rst').addEventListener('click',function(){if(confirm('Delete ALL master data?')){ls.d(KEY);ALL=[];init()}});

init();
