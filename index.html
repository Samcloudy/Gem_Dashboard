<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeM Label Seller Consultant</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{box-sizing:border-box;
--bg:#f4f6fa;--card:#fff;--tx:#18222f;--mu:#667386;--bd:#e3e8ef;--pr:#1a4d8f;--ac:#eaf2fb;--g:#2e7d32;--r:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202b;--tx:#e6ebf2;--mu:#93a0b2;--bd:#2a3442;--pr:#6aa8f0;--ac:#1e2c3f;--g:#6fcf76;--r:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
h1{margin:0 0 4px;font-size:21px;color:var(--pr)}
h3{margin:0 0 10px;font-size:15px}
.mu{color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
#drop{border:2px dashed var(--pr);border-radius:10px;padding:22px;text-align:center;cursor:pointer;background:var(--card);margin:10px 0;display:block;position:relative}
#drop:hover,#drop.over{background:var(--ac)}
#drop input[type=file]{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
select,input,button{font:inherit;padding:7px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
button{cursor:pointer;background:var(--pr);color:#fff;border:0}
button.s{background:var(--ac);color:var(--pr)}
button.d{background:var(--r)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}
.tab{background:var(--ac);color:var(--pr)}
.tab.on{background:var(--pr);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--ac);border-radius:8px;padding:10px}
.kpi b{display:block;font-size:19px;color:var(--pr)}
.kpi span{font-size:11px;color:var(--mu)}
.sc{overflow:auto;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--ac);z-index:1;white-space:nowrap}
.p{display:inline-block;padding:1px 8px;margin:1px;border-radius:9px;font-size:11px;font-weight:600;background:var(--ac);color:var(--pr)}
.p.r{background:#fdecea;color:#b3261e}
.p.a{background:#fff4e5;color:#a06000}
.p.g{background:#e8f5e9;color:#2e7d32}
.ch{position:relative;height:270px}
ul.in{margin:0;padding-left:18px;line-height:1.75}
.hb{display:flex;gap:3px}
.hb div{flex:1;text-align:center;font-size:10px;padding:8px 0;border-radius:4px;background:var(--ac)}
.pos{color:var(--g)}
.neg{color:var(--r)}
.alert{border-left:4px solid var(--pr);padding:8px 12px;background:var(--ac);border-radius:6px;margin:6px 0;font-size:13px}
.alert.r{border-color:var(--r);background:#fdecea}
.alert.a{border-color:#a06000;background:#fff4e5}
.alert.g{border-color:var(--g);background:#e8f5e9}
.rpt-page{background:#fff;padding:24px;color:#000}
@media print{#drop,.bar,.tabs{display:none}.card{box-shadow:none}}
</style>
</head>
<body>

<h1>🏷️ GeM Label &amp; Sticker — Seller Consultant</h1>
<div class="mu">Every row is a <b>won order</b> — prices = what buyers actually accepted. Sellers = competitors; buyers = prospects.</div>

<label id="drop" for="file">
  📂 <b>Drop GeM Excel here</b> or click to select
  <input type="file" id="file" accept=".xlsx,.xls">
  <div class="mu">Uploads merge into a de-duplicated master kept in this browser</div>
</label>

<div id="st" class="mu"></div>

<div id="app" hidden>
  <div class="card bar">
    <label>From <input type="date" id="from"></label>
    <label>To <input type="date" id="to"></label>
    <label>State <select id="state"></select></label>
    <label>Type <select id="cat"></select></label>
    <label>Seller <select id="me"></select></label>
    <button class="s" id="exp">⬇ JSON</button>
    <button class="s" id="xls">⬇ Excel</button>
    <button class="s" id="prt">🖨</button>
    <button class="d" id="rst">Reset</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<script>
/* =========================================================
   GLOBAL STATE
   ========================================================= */
var KEY = 'gem_master_v5';
var ALL = [];
var F = [];
var ME = '';
var TAB = 'cmd';
var SEL = 'ALL';
var CH = {};

var $ = function(id){ return document.getElementById(id); };

var ls = {
  g: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  s: function(k,v){ try { localStorage.setItem(k,v); return 1; } catch(e){ return 0; } },
  d: function(k){ try { localStorage.removeItem(k); } catch(e){} }
};

try { ALL = JSON.parse(ls.g(KEY) || '[]'); } catch(e){ ALL = []; }

var EXP = [
  'Generated Date','Buyer Designation','Buyer Contact No','Buyer GSTIN',
  'Buyer Address','Seller Company Name','Seller Contact No','Seller GSTIN',
  'Seller Address','Product Name','Ordered Quantity','Unit Price',
  'Price (Inclusive of All Duties & Taxes) - INR'
];

var CATS = [
  ['Thermal / Barcode rolls', /thermal|barcode|direct|ttr|ribbon|transfer/i],
  ['Security / Tamper', /secur|tamper|hologram|void|seal|warranty/i],
  ['A4 / Sheet labels', /\ba[34]\b|sheet|laser|inkjet/i],
  ['Address / Shipping', /address|ship|courier|dispatch|postal|awb/i],
  ['Asset / QR tags', /asset|inventory|qr|rfid|tag|serial/i],
  ['Printed / Custom', /print|custom|logo|brand|personali/i],
  ['Plain / Adhesive', /blank|plain|adhesive|self|paper|sticker|label/i]
];

var MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var BANDS = [[1,50],[51,200],[201,1000],[1001,5000],[5001,1e12]];

function cat(p){
  for (var i = 0; i < CATS.length; i++) if (CATS[i][1].test(p)) return CATS[i][0];
  return 'Other';
}

function size(p){
  var m = String(p).match(/(\d+(?:\.\d+)?)\s*(?:mm|cm|in|inch)?\s*[x\u00D7*]\s*(\d+(?:\.\d+)?)\s*(mm|cm|inch|in)?/i);
  return m ? m[1] + '\u00D7' + m[2] + (m[3] ? m[3].toLowerCase() : '') : '';
}

function tender(pdf){
  if (/^GEMC-/i.test(pdf)) return 'Direct';
  if (/^GEM-/i.test(pdf)) return 'Bid';
  return 'Unknown';
}

function nk(k){
  return String(k).replace(/[\u2013\u2014]/g,'-').replace(/\u00A0/g,' ').replace(/\s+/g,' ').trim();
}

function ct(s){ return String(s == null ? '' : s).replace(/\s{2,}/g,' ').trim(); }
function td(s){ return String(s == null ? '' : s).replace(/[-\s]+$/,'').trim(); }
function gst(s){ return String(s == null ? '' : s).replace(/\s*\(R\)\s*$/i,'').trim().toUpperCase(); }

function num(v){
  var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? 0 : n;
}

function parseState(a){
  a = String(a || '');
  var m = a.match(/([A-Z][A-Z &\.]{3,})-\d{6}/);
  if (m) return m[1].trim();
  m = a.match(/,\s*([A-Z][A-Za-z &\.]+)-\d{6}/);
  return m ? m[1].trim().toUpperCase() : 'Unknown';
}

function parseDate(v){
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if (typeof v === 'number') return new Date(Date.UTC(1899,11,30) + v*86400000).toISOString().slice(0,10);
  var s = String(v || '').trim();
  if (!s) return '';
  var m = s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/);
  if (m){
    var months = 'janfebmaraprmayjunjulaugsepoctnovdec';
    var i = months.indexOf(m[2].toLowerCase());
    if (i >= 0 && i % 3 === 0){
      var mm = String(i/3 + 1); if (mm.length < 2) mm = '0' + mm;
      var dd = m[1]; if (dd.length < 2) dd = '0' + dd;
      var yyyy = m[3].length === 2 ? '20' + m[3] : m[3];
      return yyyy + '-' + mm + '-' + dd;
    }
  }
  var d = new Date(s);
  return isNaN(d) ? '' : d.toISOString().slice(0,10);
}

function cleanRow(r){
  var q = num(r['Ordered Quantity']);
  var u = num(r['Unit Price']);
  var t = num(r['Price (Inclusive of All Duties & Taxes) - INR']);
  var p = ct(r['Product Name']);
  var pdf = ct(r['One actual sample PDF'] || r['Sample PDF'] || r['PDF'] || '');
  return {
    date: parseDate(r['Generated Date']),
    bd: ct(r['Buyer Designation']),
    bp: td(r['Buyer Contact No']),
    bg: gst(r['Buyer GSTIN']),
    bs: parseState(r['Buyer Address']),
    seller: ct(r['Seller Company Name']),
    sg: gst(r['Seller GSTIN']),
    ss: parseState(r['Seller Address']),
    prod: p, cat: cat(p), size: size(p),
    qty: q, unit: u, total: t > 0 ? t : q * u, src: tender(pdf)
  };
}

function rowKey(r){ return [r.date, r.bg, r.sg, r.prod, r.qty, r.total].join('|'); }

var sk = function(r){ return r.sg || r.seller; };
var mine = function(r){ return ME && sk(r) === ME; };

var sum = function(l, k){ var s = 0; for (var i = 0; i < l.length; i++) s += (l[i][k] || 0); return s; };

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function fm(n){
  if (n >= 1e7) return '\u20B9' + (n/1e7).toFixed(2) + ' Cr';
  if (n >= 1e5) return '\u20B9' + (n/1e5).toFixed(2) + ' L';
  return '\u20B9' + Math.round(n).toLocaleString('en-IN');
}

function r2(n){ return '\u20B9' + (n >= 100 ? Math.round(n) : n.toFixed(2)); }
function ago(d){ return Math.round((Date.now() - new Date(d)) / 86400000); }
function pc(x){ return (x * 100).toFixed(1) + '%'; }
function L(n){ return Math.round(n).toLocaleString('en-IN'); }

function grp(list, f){
  var m = new Map();
  for (var i = 0; i < list.length; i++){
    var k = f(list[i]);
    if (!k) continue;
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(list[i]);
  }
  return m;
}

function qt(a, p){
  if (!a.length) return 0;
  return a[Math.min(a.length - 1, Math.floor(a.length * p))];
}

function T(headers, rows){
  var h = '<div class="sc"><table><thead><tr>';
  for (var i = 0; i < headers.length; i++) h += '<th>' + headers[i] + '</th>';
  h += '</tr></thead><tbody>';
  for (var j = 0; j < rows.length; j++){
    h += '<tr>';
    for (var k = 0; k < rows[j].length; k++) h += '<td>' + rows[j][k] + '</td>';
    h += '</tr>';
  }
  return h + '</tbody></table></div>';
}

function pill(t, c){ return '<span class="p ' + (c||'') + '">' + t + '</span>'; }
function bandLabel(b){ return b[1] > 1e9 ? b[0] + '+' : b[0] + '\u2013' + b[1]; }

function ps(list){
  var a = [];
  for (var i = 0; i < list.length; i++) if (list[i].unit > 0) a.push(list[i].unit);
  a.sort(function(x,y){ return x - y; });
  return { n: a.length, p10: qt(a,.1), p25: qt(a,.25), p40: qt(a,.4), p50: qt(a,.5), p75: qt(a,.75), p90: qt(a,.9), a: a };
}

function med(list){ return ps(list).p50; }

function within(rows, daysBack){
  return rows.filter(function(r){ var d = ago(r.date); return d >= daysBack && d < daysBack + 30; });
}
function last30(rows){ return within(rows, 0); }
function prev30(rows){ return within(rows, 30); }

function buyersList(rows){
  var pm = new Map();
  grp(rows, function(r){ return r.prod; }).forEach(function(l, p){ pm.set(p, med(l)); });
  var out = [];
  grp(rows, function(r){ return r.bg || r.bd; }).forEach(function(l, k){
    l.sort(function(a,b){ return a.date.localeCompare(b.date); });
    var last = l[l.length-1], val = sum(l, 'total');
    var ds = [], seen = {};
    for (var i = 0; i < l.length; i++) if (!seen[l[i].date]){ seen[l[i].date] = 1; ds.push(l[i].date); }
    var cyc = ds.length > 1 ? Math.round((new Date(ds[ds.length-1]) - new Date(ds[0])) / 86400000 / (ds.length - 1)) : 0;
    var dsl = ago(last.date);
    var due = cyc ? Math.round((new Date(last.date).getTime() + cyc*86400000 - Date.now()) / 86400000) : null;
    var ix = [];
    for (var j = 0; j < l.length; j++){
      var mp = pm.get(l[j].prod);
      if (l[j].unit > 0 && mp > 0) ix.push(l[j].unit / mp);
    }
    var pidx = ix.length ? ix.reduce(function(a,b){ return a+b; }, 0) / ix.length * 100 : 0;
    var selArr = [];
    grp(l, function(r){ return r.seller; }).forEach(function(v, kk){ selArr.push([kk, v.length]); });
    selArr.sort(function(a,b){ return b[1] - a[1]; });
    var cats = [];
    grp(l, function(r){ return r.cat; }).forEach(function(v, kk){ cats.push([kk, sum(v,'total')]); });
    cats.sort(function(a,b){ return b[1] - a[1]; });
    out.push({ k: k, name: last.bd || k, state: last.bs, phone: last.bp, orders: l.length, val: val, avg: val/l.length, aq: Math.round(sum(l,'qty')/l.length), cyc: cyc, dsl: dsl, due: due, pidx: pidx, sel: selArr.map(function(x){ return x[0]; }), cat: cats[0] ? cats[0][0] : '', last: last.date });
  });
  var vals = out.map(function(b){ return b.val; }).sort(function(a,b){ return a-b; });
  var whale = qt(vals, .9);
  out.forEach(function(b){
    b.tags = [];
    if (b.due != null && b.due <= 14 && b.orders > 1) b.tags.push(['REORDER DUE','r']);
    if (b.pidx >= 115 && b.orders > 0) b.tags.push(['OVERPAYING','a']);
    if (b.val >= whale) b.tags.push(['BIG SPENDER','g']);
    if (b.orders >= 4) b.tags.push(['LOYAL/FREQUENT','g']);
    if (!b.tags.length) b.tags.push([b.orders === 1 ? 'ONE-TIME' : 'OCCASIONAL','']);
    b.score = Math.min(100, Math.round((b.dsl < 30 ? 25 : b.dsl < 90 ? 18 : b.dsl < 180 ? 10 : 3) + Math.min(b.orders * 4, 20) + Math.min(Math.log10(b.val + 1) / 7 * 25, 25) + (b.due != null && b.due <= 14 ? 15 : 0) + (b.pidx >= 115 ? 15 : 0)));
  });
  out.sort(function(a,b){ return b.score - a.score; });
  return out;
}

function sellersList(rows){
  var tot = sum(rows, 'total');
  var pm = new Map();
  grp(rows, function(r){ return r.prod; }).forEach(function(l, p){ pm.set(p, med(l)); });
  var now = Date.now();
  var out = [];
  grp(rows, sk).forEach(function(l, k){
    var v = sum(l, 'total');
    var ix = [];
    for (var i = 0; i < l.length; i++){
      var mp = pm.get(l[i].prod);
      if (l[i].unit > 0 && mp > 0) ix.push(l[i].unit / mp);
    }
    var pidx = ix.length ? ix.reduce(function(a,b){ return a+b; }, 0) / ix.length * 100 : 0;
    var rec = 0, prev = 0;
    for (var j = 0; j < l.length; j++){
      var age = (now - new Date(l[j].date)) / 86400000;
      if (age <= 90) rec += l[j].total;
      else if (age > 90 && age <= 180) prev += l[j].total;
    }
    var catArr = [];
    grp(l, function(r){ return r.cat; }).forEach(function(v, kk){ catArr.push([kk, sum(v,'total')]); });
    catArr.sort(function(a,b){ return b[1] - a[1]; });
    var states = new Set(), buyerSet = new Set();
    for (var m = 0; m < l.length; m++){
      if (l[m].bs && l[m].bs !== 'Unknown') states.add(l[m].bs);
      if (l[m].bg) buyerSet.add(l[m].bg);
    }
    var bid = 0, dir = 0;
    for (var n = 0; n < l.length; n++){
      if (l[n].src === 'Bid') bid++;
      if (l[n].src === 'Direct') dir++;
    }
    out.push({ k: k, name: l[0].seller, orders: l.length, v: v, share: tot ? v/tot : 0, buyers: buyerSet.size, states: states.size, home: l[0].ss, aq: Math.round(sum(l,'qty')/l.length), pidx: pidx, cat: catArr[0] ? catArr[0][0] : '', trend: prev ? (rec - prev)/prev : (rec ? 1 : 0), bid: bid, dir: dir });
  });
  out.sort(function(a,b){ return b.v - a.v; });
  return out;
}

function catsList(rows){
  var out = [];
  grp(rows, function(r){ return r.cat; }).forEach(function(l, c){
    var s = ps(l), bs = new Set(), ss = new Set();
    for (var i = 0; i < l.length; i++){ if (l[i].bg) bs.add(l[i].bg); ss.add(sk(l[i])); }
    out.push({ c: c, v: sum(l,'total'), n: l.length, b: bs.size, s: ss.size, p50: s.p50, p25: s.p25, aq: Math.round(sum(l,'qty')/l.length) });
  });
  out.sort(function(a,b){ return b.v - a.v; });
  return out;
}

function geoList(rows){
  var m = grp(rows, function(r){ return r.bs !== 'Unknown' ? r.bs : null; });
  var mx = 1;
  m.forEach(function(l){ var v = sum(l, 'total'); if (v > mx) mx = v; });
  var out = [];
  m.forEach(function(l, s){
    var v = sum(l, 'total');
    var sellerArr = [];
    grp(l, sk).forEach(function(x){ sellerArr.push(sum(x, 'total')); });
    sellerArr.sort(function(a,b){ return b - a; });
    var t1 = v ? sellerArr[0] / v : 0;
    var bs = new Set();
    for (var i = 0; i < l.length; i++) if (l[i].bg) bs.add(l[i].bg);
    var locCount = 0;
    for (var j = 0; j < l.length; j++) if (l[j].ss === s) locCount++;
    var loc = locCount / l.length;
    var pr = ps(l);
    out.push({ s: s, v: v, n: l.length, b: bs.size, sl: sellerArr.length, p50: pr.p50, avg: v/l.length, t1: t1, loc: loc, ease: Math.round(50 * v/mx + 30 * (1 - t1) + 20 * Math.min(bs.size/20, 1)) });
  });
  out.sort(function(a,b){ return b.ease - a.ease; });
  return out;
}

function fiscalQ4(rows){
  var t = sum(rows, 'total');
  if (!t) return 0;
  var q1 = 0;
  for (var i = 0; i < rows.length; i++){
    var m = +rows[i].date.slice(5,7) - 1;
    if (m === 0 || m === 1 || m === 2) q1 += rows[i].total;
  }
  return q1 / t;
}

function deltas(rows){
  var cur = last30(rows), prev = prev30(rows);
  function agg(list, f, vf){
    var m = new Map();
    for (var i = 0; i < list.length; i++){
      var k = f(list[i]);
      if (!k) continue;
      m.set(k, (m.get(k) || 0) + (vf(list[i]) || 0));
    }
    return m;
  }
  function diff(a, b){
    var out = [];
    var keys = new Set();
    a.forEach(function(v, k){ keys.add(k); });
    b.forEach(function(v, k){ keys.add(k); });
    keys.forEach(function(k){
      var n = a.get(k) || 0, o = b.get(k) || 0;
      if (n === 0 && o === 0) return;
      var delta = o ? (n - o) / o : (n > 0 ? 1 : 0);
      out.push({ k: k, now: n, prev: o, delta: delta, change: n - o });
    });
    out.sort(function(x,y){ return Math.abs(y.change) - Math.abs(x.change); });
    return out;
  }
  var cPrice = ps(cur), pPrice = ps(prev);
  return {
    buyer: diff(agg(cur, function(r){ return r.bg || r.bd; }, function(r){ return r.total; }), agg(prev, function(r){ return r.bg || r.bd; }, function(r){ return r.total; })),
    seller: diff(agg(cur, sk, function(r){ return r.total; }), agg(prev, sk, function(r){ return r.total; })),
    size: diff(agg(cur, function(r){ return r.size; }, function(r){ return r.total; }), agg(prev, function(r){ return r.size; }, function(r){ return r.total; })),
    state: diff(agg(cur, function(r){ return r.bs !== 'Unknown' ? r.bs : null; }, function(r){ return r.total; }), agg(prev, function(r){ return r.bs !== 'Unknown' ? r.bs : null; }, function(r){ return r.total; })),
    cat: diff(agg(cur, function(r){ return r.cat; }, function(r){ return r.total; }), agg(prev, function(r){ return r.cat; }, function(r){ return r.total; })),
    price: { n: cPrice.n, prev: pPrice.n, p50: cPrice.p50, p50Prev: pPrice.p50, delta: pPrice.p50 ? (cPrice.p50 - pPrice.p50) / pPrice.p50 : 0 },
    totals: { cur: sum(cur, 'total'), prev: sum(prev, 'total'), orders: cur.length, ordersPrev: prev.length },
    names: function(g){
      var m = new Map();
      for (var i = 0; i < rows.length; i++){
        var k = g(rows[i]);
        if (!k) continue;
        if (!m.has(k)) m.set(k, rows[i]);
      }
      return m;
    }
  };
}

function watchlist(rows){
  var alerts = [];
  grp(rows, sk).forEach(function(l){
    var c = ps(last30(l)), p = ps(prev30(l));
    if (c.n >= 2 && p.n >= 2 && p.p50){
      var d = (c.p50 - p.p50) / p.p50;
      if (d <= -0.08) alerts.push({ t: 'r', m: '<b>' + esc(l[0].seller) + '</b> cut prices ' + (-d*100).toFixed(0) + '% in last 30 days (' + r2(p.p50) + ' → ' + r2(c.p50) + ')' });
      if (d >= 0.08) alerts.push({ t: 'g', m: '<b>' + esc(l[0].seller) + '</b> raised prices ' + (d*100).toFixed(0) + '% — opportunity to undercut' });
    }
  });
  grp(rows, function(r){ return r.bg; }).forEach(function(l, k){
    if (l.length >= 3){
      var last = l.map(function(r){ return r.date; }).sort().pop();
      var dd = ago(last);
      if (dd >= 180) alerts.push({ t: 'a', m: 'Buyer <b>' + esc(l[0].bd || k) + '</b> (' + l.length + ' past orders) hasn\'t ordered in ' + dd + ' days — win-back call' });
    }
  });
  var recent = last30(rows);
  for (var i = 0; i < recent.length; i++){
    if (recent[i].total >= 1e5) alerts.push({ t: 'g', m: 'Large recent order: <b>' + fm(recent[i].total) + '</b> — ' + esc(recent[i].bd || recent[i].bg) + ' in ' + esc(recent[i].bs) });
  }
  return alerts.slice(0, 15);
}

function calc(){

  var u = win / a.length, m = c ? (p - c) / p : null;
  var out = '<div>Undercuts <b>' + (u * 100).toFixed(0) + '%</b> of past winning prices → ';
  if (u > 0.7) out += pill('Very likely to win', 'g');
  else if (u > 0.45) out += pill('Competitive', 'g');
  else if (u > 0.25) out += pill('Needs USP', 'a');
  else out += pill('Likely too high', 'r');
  out += '</div>';
  if (m != null){
    out += '<div>Margin <b class="' + (m < 0.1 ? 'neg' : 'pos') + '">' + (m * 100).toFixed(1) + '%</b> · profit on ' + L(q) + ' units <b>' + fm((p - c) * q) + '</b></div>';
    if (c) out += '<div class="mu">Lowest price keeping 10% margin: ' + r2(c / 0.9) + '</div>';
  } else out += '<div>Order value ' + fm(p * q) + '</div>';
  $('cout').innerHTML = out;
}

function apply(){
  var f = $('from').value, t = $('to').value, s = $('state').value, c = $('cat').value;
  F = ALL.filter(function(r){
    // If From is set, row date must be >= From
    if (f && r.date < f) return false;
    // If To is set, row date must be <= To (inclusive — end of day already covers same-day rows)
    if (t && r.date > t) return false;
    if (s && r.bs !== s) return false;
    if (c && r.cat !== c) return false;
    return true;
  });
  show();
}

function handle(f){
  if (!f) return;
  msg('Reading ' + f.name + ' (' + Math.round(f.size / 1024) + ' KB) …');
  var rd = new FileReader();
  rd.onload = function(e){
    try {
      var wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      console.log('📄 Sheets:', wb.SheetNames);
      var best = null;
      for (var i = 0; i < wb.SheetNames.length; i++){
        var name = wb.SheetNames[i];
        var rows;
        try { rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' }); } catch(err){ continue; }
        if (!rows.length) continue;
        var h = 0;
        while (h < rows.length && rows[h].filter(function(c){ return String(c).trim(); }).length < 3) h++;
        if (h >= rows.length) continue;
        var normRow = rows[h].map(nk).map(function(x){ return String(x).toLowerCase().replace(/[^a-z0-9]/g, ''); });
        var normExp = EXP.map(function(x){ return x.toLowerCase().replace(/[^a-z0-9]/g, ''); });
        var m = normExp.filter(function(x){ return normRow.indexOf(x) >= 0; }).length;
        console.log('Sheet "' + name + '": header row ' + h + ', matches ' + m);
        if (!best || m > best.m) best = { n: name, m: m, h: h };
      }
      if (!best || best.m < 3){
        msg('No GeM data sheet found. Sheets: ' + wb.SheetNames.join(', ') + ' — need at least 3 standard columns.', 1);
        return;
      }
      console.log('✅ Using:', best.n, best.m, 'matching columns');
      var raw = XLSX.utils.sheet_to_json(wb.Sheets[best.n], { defval: '', raw: false }).map(function(r){
        var o = {};
        for (var k in r) o[nk(k)] = r[k];
        return o;
      });
      console.log('Raw rows:', raw.length);
      var cleaned = raw.map(cleanRow).filter(function(r){ return r.seller && r.date; });
      console.log('Cleaned rows:', cleaned.length);
      if (!cleaned.length){
        msg('0 valid rows after cleaning. Check seller name and date columns.', 1);
        return;
      }
      var seen = new Set(ALL.map(rowKey));
      var add = 0;
      for (var j = 0; j < cleaned.length; j++){
        var k2 = rowKey(cleaned[j]);
        if (!seen.has(k2)){ seen.add(k2); ALL.push(cleaned[j]); add++; }
      }
      var ok = ls.s(KEY, JSON.stringify(ALL));
      msg('✅ ' + best.n + ': ' + cleaned.length + ' cleaned, ' + add + ' new, master ' + ALL.length.toLocaleString('en-IN') + ' rows.' + (ok ? '' : ' (Too big to persist — export.)'));
      init();
    } catch(x){
      console.error('❌ Upload error:', x);
      msg('Error: ' + x.message, 1);
    }
  };
  rd.onerror = function(){ msg('Could not read the file.', 1); };
  rd.readAsArrayBuffer(f);
}

(function wireUpload(){
  var dz = $('drop'), fi = $('file');
  if (!dz || !fi){ console.error('Upload elements missing'); return; }
  dz.addEventListener('click', function(e){ if (e.target !== fi) e.preventDefault(); fi.click(); });
  dz.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fi.click(); } });
  dz.setAttribute('tabindex', '0');
  dz.setAttribute('role', 'button');
  fi.addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if (f) handle(f);
    e.target.value = '';
  });
  fi.addEventListener('click', function(e){ e.stopPropagation(); });
  ['dragenter','dragover'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); e.stopPropagation(); dz.classList.add('over'); }); });
  ['dragleave','drop'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); e.stopPropagation(); dz.classList.remove('over'); }); });
  dz.addEventListener('drop', function(e){
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handle(f);
  });
  console.log('✅ Upload wiring ready.');
})();
